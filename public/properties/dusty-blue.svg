<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe3ea"/>
      <stop offset="1" stop-color="#b9c8d6"/>
    </linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebccb"/>
      <stop offset="1" stop-color="#dde2e6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="935" cy="205" r="78" fill="#f7d98d" opacity="0.55"/>
  <path d="M0 690 Q 300 640 600 672 T 1200 656 V900 H0 Z" fill="url(#grd)" opacity="0.9"/>
  <!-- main villa -->
  <rect x="250" y="430" width="470" height="300" fill="#f3f4f5"/>
  <rect x="250" y="430" width="470" height="300" fill="#000" opacity="0.02"/>
  <polygon points="230,432 485,300 740,432" fill="#5f7285"/>
  <!-- side wing -->
  <rect x="700" y="510" width="250" height="220" fill="#dde2e6"/>
  <polygon points="686,512 825,420 964,512" fill="#5f7285" opacity="0.92"/>
  <!-- windows glow -->
  <g fill="#f7d98d">
    <rect x="300" y="486" width="70" height="92" rx="4"/>
    <rect x="405" y="486" width="70" height="92" rx="4"/>
    <rect x="510" y="486" width="70" height="92" rx="4"/>
    <rect x="740" y="556" width="58" height="76" rx="4"/>
    <rect x="828" y="556" width="58" height="76" rx="4"/>
  </g>
  <!-- door -->
  <rect x="605" y="628" width="66" height="102" rx="3" fill="#5f7285"/>
  <!-- slim trees -->
  <g fill="#5f7285" opacity="0.8">
    <rect x="168" y="560" width="12" height="170"/>
    <ellipse cx="174" cy="548" rx="46" ry="60"/>
    <rect x="1030" y="576" width="11" height="154"/>
