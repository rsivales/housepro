<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd0e0"/>
      <stop offset="1" stop-color="#a7a9c6"/>
    </linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6b4cc"/>
      <stop offset="1" stop-color="#d7d3e0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="935" cy="205" r="78" fill="#ffd27a" opacity="0.55"/>
  <path d="M0 690 Q 300 640 600 672 T 1200 656 V900 H0 Z" fill="url(#grd)" opacity="0.9"/>
  <!-- main villa -->
  <rect x="250" y="430" width="470" height="300" fill="#eceaf1"/>
  <rect x="250" y="430" width="470" height="300" fill="#000" opacity="0.02"/>
