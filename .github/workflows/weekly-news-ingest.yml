name: Ingestão semanal de artigos

on:
  schedule:
    # Segunda-feira às 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ingest-news.mjs
        env:
          ARTICLES_INGEST_URL: ${{ secrets.ARTICLES_INGEST_URL }}
          ARTICLES_INGEST_SECRET: ${{ secrets.ARTICLES_INGEST_SECRET }}
